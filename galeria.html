<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniradio - Galeria</title>
    <!-- Wymuszenie ikony -->
    <link rel="icon" type="image/png" sizes="32x32" href="logogradientbeztekstu.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logogradientbeztekstu.png">
    <link rel="shortcut icon" type="image/png" href="logogradientbeztekstu.png">
    <link rel="apple-touch-icon" href="logogradientbeztekstu.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ikony -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonty: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    },
                    colors: {
                        'radio-dark': '#0f172a',
                        'radio-accent': '#8b5cf6', 
                        'radio-neon': '#38bdf8',   
                        'radio-pink': '#f472b6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        html { scroll-behavior: smooth; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Subtelne animacje galerii */
        .gallery-item {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .gallery-item.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            position: absolute;
        }
        
        /* Chowanie przycisków w lightboxie na mobilkach, żeby nie zasłaniały */
        @media (max-width: 768px) {
            .lightbox-btn-text { display: none; }
        }
    </style>
</head>
<body class="bg-radio-dark text-white font-sans antialiased overflow-x-hidden pb-24">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 transition-all duration-300" id="navbar">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center glass-panel rounded-b-2xl mt-0 relative z-50">
            <!-- Logo -->
            <a href="/" class="flex items-center gap-3 hover:opacity-90 transition group">
                <img src="logogradientztekstem.png" 
                     alt="UniRadio Logo" 
                     class="h-12 w-auto object-contain"
                     onerror="this.style.display='none'; document.getElementById('fallback-logo').classList.remove('hidden'); document.getElementById('fallback-logo').classList.add('flex');">
                
                <div id="fallback-logo" class="hidden items-center gap-3">
                    <div class="relative w-10 h-10 flex items-center justify-center">
                        <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full text-radio-accent group-hover:scale-110 transition duration-300">
                            <circle cx="50" cy="50" r="7" fill="#38bdf8" />
                            <path d="M38 38 A 18 18 0 0 0 38 62" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
                            <path d="M28 28 A 32 32 0 0 0 28 72" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
                            <path d="M62 38 A 18 18 0 0 1 62 62" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
                            <path d="M72 28 A 32 32 0 0 1 72 72" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-2xl font-black tracking-tighter uppercase">Uni<span class="text-radio-accent">Radio</span></span>
                        <span class="text-[8px] uppercase tracking-[0.2em] font-bold text-gray-400">Uniwersytet Wrocławski</span>
                    </div>
                </div>
            </a>
            
            <!-- Linki Desktop -->
            <div class="hidden md:flex items-center space-x-8 font-medium">
                <a href="/" class="hover:text-radio-accent transition">Start</a>
                <div class="h-6 w-px bg-white/20"></div>
                <a href="podcasty" class="hover:text-radio-accent transition">Podcasty</a>
                <a href="artykuly" class="hover:text-radio-accent transition">Artykuły</a>
            </div>

            <div class="flex items-center gap-4">
                <a href="https://www.instagram.com/uniradio.projekt/" target="_blank" 
                   class="flex items-center gap-2 bg-gradient-to-tr from-radio-accent/20 to-radio-pink/20 hover:from-radio-accent hover:to-radio-pink text-white px-4 py-2 rounded-full transition-all duration-300 border border-white/10 group shadow-lg shadow-radio-accent/10">
                    <i data-lucide="instagram" class="w-5 h-5 group-hover:scale-110 transition"></i>
                    <span class="text-xs font-bold hidden lg:inline">Instagram</span>
                </a>

                <!-- Mobile Menu Button -->
                <button class="md:hidden text-gray-300 hover:text-white transition" onclick="toggleMobileMenu()">
                    <i data-lucide="menu" class="w-8 h-8"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full px-4 -mt-2 pb-4">
            <div class="glass-panel rounded-2xl p-6 flex flex-col space-y-4 shadow-2xl animate-in slide-in-from-top-4 duration-200">
                <a href="/" class="text-lg font-medium hover:text-radio-accent transition border-b border-white/5 pb-2" onclick="toggleMobileMenu()">Start</a>
                
                <a href="podcasty" class="text-lg font-medium hover:text-radio-neon transition flex items-center gap-2" onclick="toggleMobileMenu()">
                    <i data-lucide="headphones" class="w-4 h-4"></i> Podcasty
                </a>
                <a href="artykuly" class="text-lg font-medium hover:text-radio-pink transition flex items-center gap-2" onclick="toggleMobileMenu()">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Artykuły
                </a>
            </div>
        </div>
    </nav>

    <!-- HERO GALERII -->
    <header class="relative pt-36 pb-16 overflow-hidden">
        <div class="absolute top-0 right-0 w-[400px] h-[400px] bg-radio-neon/10 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-radio-accent/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="container mx-auto px-6 relative z-10 text-center">
            <h1 class="text-5xl md:text-7xl font-black leading-tight mb-4 tracking-tight">
                Galeria
            </h1>
        </div>
    </header>

    <!-- GALERIA - ZAWARTOŚĆ -->
    <section class="pb-24 relative z-10 min-h-screen">
        <div class="container mx-auto px-6">
            
            <!-- Pasek nawigacji po latach -->
            <div class="flex flex-wrap justify-center gap-3 mb-12 sticky top-24 z-40 bg-radio-dark/80 backdrop-blur-md py-4 rounded-2xl" id="nav-buttons">
                <!-- Przyciski zostaną wygenerowane przez JS -->
            </div>

            <!-- Kontener na wszystkie lata i zdjęcia -->
            <div id="gallery-container" class="relative">
                <!-- Zdjęcia wgrywane przez JavaScript (pogrupowane latami) -->
            </div>

            <!-- Pusty stan (na wszelki wypadek) -->
            <div id="empty-state" class="hidden text-center py-20">
                <div class="bg-slate-800/50 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="camera-off" class="w-10 h-10 text-gray-600"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-300">Brak zdjęć</h3>
            </div>

        </div>
    </section>

    <!-- LIGHTBOX (Otwieranie zdjęć na pełen ekran) -->
    <div id="lightbox" class="fixed inset-0 z-[100] hidden bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300 opacity-0">
        
        <!-- Pasek górny (Zamykanie i Rok) -->
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-50">
            <span id="lightbox-year" class="bg-radio-accent text-white px-4 py-1.5 rounded-full text-sm font-bold tracking-wider"></span>
            
            <button onclick="closeLightbox()" class="text-gray-400 hover:text-white transition bg-slate-800/50 hover:bg-slate-700/80 p-3 rounded-full backdrop-blur-sm">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Przycisk Wstecz -->
        <button onclick="prevImage(event)" class="absolute left-4 top-1/2 -translate-y-1/2 z-50 text-white/50 hover:text-white transition bg-slate-800/30 hover:bg-radio-accent p-4 md:p-6 rounded-full backdrop-blur-sm group">
            <i data-lucide="chevron-left" class="w-8 h-8 md:w-10 md:h-10 transform group-hover:-translate-x-1 transition"></i>
        </button>

        <!-- Zdjęcie Główne -->
        <div class="relative w-full max-w-5xl max-h-[80vh] px-16 flex items-center justify-center" onclick="closeLightbox(event)" id="lightbox-content">
            <img id="lightbox-img" src="" alt="Powiększone zdjęcie" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl ring-1 ring-white/10" onclick="event.stopPropagation()">
        </div>

        <!-- Przycisk Dalej -->
        <button onclick="nextImage(event)" class="absolute right-4 top-1/2 -translate-y-1/2 z-50 text-white/50 hover:text-white transition bg-slate-800/30 hover:bg-radio-accent p-4 md:p-6 rounded-full backdrop-blur-sm group">
            <i data-lucide="chevron-right" class="w-8 h-8 md:w-10 md:h-10 transform group-hover:translate-x-1 transition"></i>
        </button>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 pt-12 pb-12 border-t border-slate-800 mt-12">
        <div class="container mx-auto px-6 flex flex-col items-center text-center">
            <div class="flex items-center gap-2 mb-2">
                <i data-lucide="radio" class="text-radio-accent w-5 h-5"></i>
                <span class="text-lg font-bold">Uniradio</span>
            </div>
            <p class="text-gray-600 text-[10px] uppercase tracking-widest">Gramy słowem</p>
        </div>
    </footer>

    <!-- SKRYPTY LOGIKI GALERII -->
    <script>
        // BAZA ZDJĘĆ - Mix poziomych i pionowych zdjęć z różnych lat
        const galleryData = [
            // 2026
            { id: 13, year: '2026', src: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&q=80&w=600&h=800' },
            { id: 14, year: '2026', src: 'https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&q=80&w=800&h=500' },
            { id: 15, year: '2026', src: 'https://images.unsplash.com/photo-1516280440502-61db1d75d335?auto=format&fit=crop&q=80&w=800' },
            
            // 2025
            { id: 16, year: '2025', src: 'https://images.unsplash.com/photo-1559523161-0fc0d6b3865b?auto=format&fit=crop&q=80&w=600&h=900' },
            { id: 17, year: '2025', src: 'https://images.unsplash.com/photo-1563330232-5711470ce040?auto=format&fit=crop&q=80&w=800&h=600' },

            // 2024
            { id: 1, year: '2024', src: 'DSC_0011 (Duży).jpg' },
            { id: 2, year: '2024', src: 'DSC_0020 (Duży).jpg' },
            { id: 3, year: '2024', src: 'DSC_0024 (Duży).jpg' },
            { id: 4, year: '2024', src: 'DSC_0031 (Duży).jpg' },
            { id: 18, year: '2024', src: 'DSC_0037 (Duży).jpg' },
            { id: 19, year: '2024', src: 'DSC_0041 (Duży).jpg' },
            { id: 20, year: '2024', src: 'DSC_0047 (Duży).jpg' },
            { id: 21, year: '2024', src: 'DSC_0051 (Duży).jpg' },
            { id: 22, year: '2024', src: 'DSC_0062 (Duży).jpg' },
            { id: 23, year: '2024', src: 'DSC_0063 (Duży).jpg' },
            
            // 2023
            { id: 5, year: '2023', src: 'https://images.unsplash.com/photo-1616423640778-28d1b53229bd?auto=format&fit=crop&q=80&w=800' },
            { id: 6, year: '2023', src: 'https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&q=80&w=600&h=800' },
            { id: 7, year: '2023', src: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=800&h=400' }
        ];

        let allImagesSorted = [];
        let currentLightboxIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Sortowanie zdjęć od najnowszych
            allImagesSorted = [...galleryData].sort((a, b) => parseInt(b.year) - parseInt(a.year));
            
            generateNavButtons();
            renderGallery();
        });

        // --- OBSŁUGA MENU MOBILNEGO ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // --- Navbar Scroll Effect ---
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) { 
                navbar.classList.add('bg-slate-900/90', 'shadow-lg'); 
            } else { 
                navbar.classList.remove('bg-slate-900/90', 'shadow-lg'); 
            }
        });

        // Generowanie nawigacji (skoków) na podstawie dostępnych lat
        function generateNavButtons() {
            const navContainer = document.getElementById('nav-buttons');
            const years = [...new Set(allImagesSorted.map(item => item.year))]; 
            
            years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = `px-6 py-2 rounded-full font-bold text-sm transition-all duration-300 border bg-slate-800 text-gray-400 border-slate-700 hover:border-radio-neon hover:text-white`;
                btn.innerText = year;
                btn.onclick = () => {
                    const section = document.getElementById(`year-${year}`);
                    if(section) {
                        section.scrollIntoView({ behavior: 'smooth' });
                    }
                };
                navContainer.appendChild(btn);
            });
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            if (allImagesSorted.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            // Grupowanie zdjęć po latach
            const groupedByYear = {};
            allImagesSorted.forEach((img, index) => {
                if(!groupedByYear[img.year]) groupedByYear[img.year] = [];
                // Zapamiętujemy globalny index dla lightboxa
                groupedByYear[img.year].push({ ...img, globalIndex: index }); 
            });

            // Gwarancja sortowania malejącego (od najnowszego) 
            // - JS domyślnie sortuje klucze numeryczne rosnąco, więc to naprawiamy
            const sortedYears = Object.keys(groupedByYear).sort((a, b) => b - a);

            // Tworzenie sekcji dla każdego roku z układem Masonry
            for (const year of sortedYears) {
                const images = groupedByYear[year];
                const yearSection = document.createElement('div');
                yearSection.id = `year-${year}`;
                yearSection.className = 'scroll-mt-48 mb-20'; // scroll-mt by navbar i sticky-menu nie zasłaniało tytułu

                yearSection.innerHTML = `
                    <div class="flex items-center gap-4 mb-8">
                        <h2 class="text-4xl font-black text-radio-neon">${year}</h2>
                        <div class="h-px flex-1 bg-gradient-to-r from-radio-neon/50 to-transparent"></div>
                    </div>
                    <!-- Układ Masonry: columns -->
                    <div class="columns-2 md:columns-3 lg:columns-4 gap-4 md:gap-6 space-y-4 md:space-y-6">
                        ${images.map(img => `
                            <div class="gallery-item break-inside-avoid relative group cursor-pointer rounded-2xl overflow-hidden bg-slate-800" onclick="openLightbox(${img.globalIndex})">
                                <img src="${img.src}" loading="lazy" class="w-full h-auto block group-hover:scale-105 transition duration-700">
                                
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                    <div class="flex justify-end transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                                        <div class="bg-radio-accent text-white p-3 rounded-full shadow-lg">
                                            <i data-lucide="maximize-2" class="w-5 h-5"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(yearSection);
            }
            
            lucide.createIcons();
        }

        // --- LIGHTBOX LOGIC ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxYear = document.getElementById('lightbox-year');

        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('hidden');
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
                lightbox.classList.add('opacity-100');
            }, 10);
            
            document.body.style.overflow = 'hidden'; // Zablokuj scrollowanie tła
        }

        function closeLightbox(event) {
            if (event && event.target !== event.currentTarget) return;

            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            
            setTimeout(() => {
                lightbox.classList.add('hidden');
                document.body.style.overflow = ''; 
            }, 300);
        }

        function updateLightboxContent() {
            const imgData = allImagesSorted[currentLightboxIndex];
            
            lightboxImg.style.opacity = '0';
            setTimeout(() => {
                lightboxImg.src = imgData.src;
                lightboxYear.innerText = imgData.year;
                lightboxImg.style.opacity = '1';
            }, 150);
        }

        function nextImage(event) {
            if(event) event.stopPropagation();
            currentLightboxIndex = (currentLightboxIndex + 1) % allImagesSorted.length;
            updateLightboxContent();
        }

        function prevImage(event) {
            if(event) event.stopPropagation();
            currentLightboxIndex = (currentLightboxIndex - 1 + allImagesSorted.length) % allImagesSorted.length;
            updateLightboxContent();
        }

        // Obsługa klawiatury dla Lightboxa
        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('hidden')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

    </script>
</body>
</html>
